<style>
/* ---------------------------------------------------------------
   Marcus Aurelius Perfumes, company portfolio, print edition.

   Same identity as the site, laid out for the page rather than for the
   scroll. The one thing deliberately different is contrast: the website
   can afford dim cream on ink because a screen is backlit and the reader
   is skimming. Forty pages of continuous reading cannot, so the body text
   here is lifted well clear of the ground and the measure is held near
   seventy characters.
   --------------------------------------------------------------- */

@page {
  size: A4;
  /* Zero, because Chrome paints no background into an @page margin by any
     means: not from html, not from body, not from a fixed element. Measured
     rather than assumed. The vertical space comes from .sheet instead. */
  margin: 0;
}

:root {
  --ink:        #14110D;
  --ink-soft:   #1B1712;
  --ink-panel:  #221D16;
  --cream:      #F3EEE4;
  --body:       #E4DCCC;   /* long-form reading, deliberately near-full strength */
  --dim:        #A99C86;   /* captions and asides only, never a paragraph */
  --gold:       #C9A25C;
  --gold-soft:  #E0C48D;
  --bronze:     #8A6A3C;
  --rule:       #3A322600;

  --display: "Cinzel", "Times New Roman", serif;
  --script:  "Playfair Display", Georgia, serif;
  --text:    "EB Garamond", Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  /* see .ground below: this alone does not reach the page margins */
  color: var(--body);
  font-family: var(--text);
  font-size: 13pt;
  line-height: 1.68;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* The ground has to be painted by something that repeats on every page.
   A background on the root element covers only the area inside the @page
   margins once those margins exist, which left a white band at the head and
   foot of every sheet. A fixed element is painted onto each page in paged
   media, so this one covers the paper edge to edge. */
.sheet {
  /* Padding on a fragmented box normally applies to its first fragment only,
     which is what left page two of every section running to the paper edge.
     Cloning the decoration repeats it on every fragment, so each page carries
     the same margins while the ground still reaches the edge. */
  padding: 22mm 20mm 20mm;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* Nothing is allowed to strand a line on its own at the top or bottom of a
   page, and a heading always travels with the thing it introduces. */
p, li, td { orphans: 2; widows: 2; }

h2, h3, h4, caption, .eyebrow {
  break-after: avoid-page;
  page-break-after: avoid;
}

h2 { break-before: avoid-page; }

.card, .stat, .pull, .note, .grid2, .grid3, .grid4 {
  break-inside: avoid;
  page-break-inside: avoid;
}

/* A long table held together whole takes a page of its own and leaves the
   one before it half empty. It breaks between rows instead, never through
   one, and carries its own header onto the continuation. */
table { break-inside: auto; }
tr    { break-inside: avoid; page-break-inside: avoid; }
thead { display: table-header-group; }
caption { break-after: avoid-page; page-break-after: avoid; }

/* A pull quote cannot break internally, so when it did not fit at the foot of
   a page it took a page of its own. It travels with what precedes it instead. */
.pull, .note { break-before: avoid-page; page-break-before: avoid; }

/* ---------- cover ---------- */
.cover {
  height: 297mm;
  width: 210mm;
  page-break-after: always;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 26mm;
  position: relative;
}
.cover .lockup { width: 96mm; height: auto; margin-bottom: 4mm; }
.cover h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 32pt;
  letter-spacing: 0.16em;
  color: var(--cream);
  margin: 0;
  text-transform: uppercase;
  line-height: 1.2;
}
.cover .script {
  font-family: var(--script);
  font-style: italic;
  font-size: 21pt;
  color: var(--gold-soft);
  margin: 2mm 0 0;
}
.cover .rule { width: 44mm; height: 1px; background: var(--gold); opacity: .8; margin: 9mm 0; }
.cover .claim {
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--body);
  line-height: 2.1;
  margin: 0;
}
.cover .claim b { color: var(--gold); font-weight: 400; display: block; }
.cover .meta {
  position: absolute;
  bottom: 22mm;
  left: 0; right: 0;
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  line-height: 2.2;
}
.cover .meta a { color: var(--gold); text-decoration: none; }

/* ---------- section furniture ---------- */
.section { page-break-before: always; }
.section:first-of-type { page-break-before: avoid; }

.eyebrow {
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 4mm;
  display: flex;
  align-items: center;
  gap: 4mm;
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--bronze); opacity: .55; }

h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 24pt;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--cream);
  margin: 0 0 7mm;
  line-height: 1.15;
}

h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 12.5pt;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 8mm 0 2.5mm;
}

h4 {
  font-family: var(--text);
  font-weight: 600;
  font-size: 13.5pt;
  color: var(--cream);
  margin: 6mm 0 1.5mm;
  letter-spacing: 0.01em;
}

p { margin: 0 0 4.5mm; max-width: 168mm; }
p.lead { font-size: 14.6pt; color: var(--cream); line-height: 1.6; }
em { font-style: italic; color: var(--cream); }
strong { font-weight: 600; color: var(--cream); }

.fig { font-family: var(--display); color: var(--gold); font-size: 1.12em; letter-spacing: .02em; }

.note {
  font-size: 12pt;
  color: var(--dim);
  font-style: italic;
  border-left: 1px solid var(--bronze);
  padding-left: 5mm;
  margin: 5mm 0;
  max-width: 155mm;
}

.pull {
  font-family: var(--script);
  font-style: italic;
  font-size: 17pt;
  line-height: 1.5;
  color: var(--gold-soft);
  border-top: 1px solid var(--bronze);
  border-bottom: 1px solid var(--bronze);
  padding: 6mm 0;
  margin: 8mm 0;
  max-width: 150mm;
}

/* ---------- tables ---------- */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 5mm 0 6mm;
  font-size: 12pt;
  page-break-inside: avoid;
}
caption {
  text-align: left;
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  padding-bottom: 2.5mm;
}
th {
  text-align: left;
  font-family: var(--display);
  font-weight: 600;
  font-size: 12pt;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--gold-soft);
  border-bottom: 1px solid var(--bronze);
  padding: 2mm 3mm 2mm 0;
}
td {
  padding: 2.4mm 3mm 2.4mm 0;
  border-bottom: 1px solid rgba(138,106,60,.28);
  color: var(--body);
  vertical-align: top;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
tr.total td { border-bottom: none; border-top: 1px solid var(--bronze); color: var(--cream); font-weight: 600; padding-top: 3mm; }

/* ---------- blocks ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm 8mm; margin: 4mm 0 6mm; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; margin: 4mm 0 6mm; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; margin: 4mm 0 6mm; }

.card {
  background: var(--ink-soft);
  border: 1px solid rgba(138,106,60,.4);
  padding: 5mm 5.5mm;
  page-break-inside: avoid;
}
.card h4 { margin-top: 0; }
.card p:last-child { margin-bottom: 0; }

.stat {
  background: var(--ink-soft);
  border: 1px solid rgba(138,106,60,.4);
  padding: 5mm 4mm;
  text-align: center;
  page-break-inside: avoid;
}
.stat .n {
  font-family: var(--display);
  font-size: 19pt;
  color: var(--gold);
  display: block;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat .l { font-size: 12pt; color: var(--dim); display: block; margin-top: 2mm; line-height: 1.4; }

ul.plain { margin: 0 0 4mm; padding-left: 5mm; max-width: 165mm; }
ul.plain li { margin-bottom: 2mm; }
ul.plain li::marker { color: var(--gold); }

.keyline { height: 1px; background: var(--bronze); opacity: .5; margin: 8mm 0; }

/* ---------- the live portfolio page ---------- */
.linkpage {
  height: 297mm;
  display: flex;
  align-items: center;
  justify-content: center;
  page-break-after: always;
}
.linkcard {
  border: 1px solid var(--bronze);
  padding: 16mm 12mm;
  text-align: center;
  max-width: 162mm;
  width: 100%;
}
.linkcard .eyebrow::after { display: none; }
.linklead {
  font-size: 14.6pt;
  color: var(--cream);
  line-height: 1.6;
  margin: 0 auto 10mm;
  max-width: 108mm;
}
.bigurl {
  display: block;
  font-family: var(--display);
  font-size: 19pt;
  letter-spacing: 0.03em;
  overflow-wrap: anywhere;
  color: var(--gold);
  text-decoration: none;
  border-top: 1px solid var(--bronze);
  border-bottom: 1px solid var(--bronze);
  padding: 7mm 0;
  margin-bottom: 10mm;
}
.qr { width: 34mm; height: 34mm; display: block; margin: 0 auto 7mm; }
.linknote {
  font-size: 12pt;
  color: var(--dim);
  margin: 0 auto 10mm;
  max-width: 112mm;
}
.linkmeta {
  display: flex;
  justify-content: center;
  gap: 10mm;
  flex-wrap: wrap;
  border-top: 1px solid rgba(138,106,60,.4);
  padding-top: 7mm;
}
.linkmeta div { display: flex; flex-direction: column; gap: 1.5mm; }
.linkmeta span {
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}
.linkmeta a { color: var(--body); text-decoration: none; font-size: 13pt; }

/* ---------- closing credit ---------- */
.creditpage {
  height: 297mm;
  display: flex;
  align-items: center;
  justify-content: center;
  break-inside: avoid;
}
.creditcard { text-align: center; }
.credit-portrait {
  width: 62mm;
  height: 77mm;
  object-fit: cover;
  border: 1px solid rgba(138,106,60,.6);
  display: block;
  margin: 0 auto 11mm;
}
.credit-line {
  font-family: var(--script);
  font-style: italic;
  font-size: 19pt;
  color: var(--gold-soft);
  margin: 0 0 6mm;
  max-width: none;
}
.credit-name {
  font-family: var(--display);
  font-size: 15pt;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cream);
  margin: 0 0 9mm;
  max-width: none;
}
.credit-meta { font-size: 12pt; color: var(--dim); margin: 0; max-width: none; }

/* ---------- contents ---------- */
.toc { list-style: none; margin: 6mm 0 0; padding: 0; column-count: 1; }
.toc li {
  display: flex;
  align-items: baseline;
  gap: 3mm;
  padding: 1.9mm 0;
  border-bottom: 1px solid rgba(138,106,60,.25);
}
.toc .num {
  font-family: var(--display);
  font-size: 12pt;
  color: var(--gold);
  min-width: 13mm;
  letter-spacing: .1em;
}
.toc .name { font-size: 13pt; color: var(--cream); }
.toc .part {
  font-family: var(--display);
  font-size: 12pt;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--dim);
  border: none;
  padding-top: 4mm;
  display: block;
}
</style>
